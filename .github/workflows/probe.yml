name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe bilibili endpoints from Azure
        run: |
          python - <<'EOF'
          import urllib.request, urllib.error
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          urls = [
            "https://api.bilibili.com/x/polymer/web-dynamic/v1/feed/space?host_mid=3706962053172003",
            "https://api.bilibili.com/x/relation/stat?vmid=3706962053172003",
            "https://api.bilibili.com/x/web-interface/nav",
            "https://www.bilibili.com/",
            "https://m.bilibili.com/space/3706962053172003/dynamic",
            "https://m.bilibili.com/dynamic/1272612579497213977",
            "https://app.bilibili.com/x/v2/space?vmid=3706962053172003&pn=1&ps=1",
            "https://api.bilibili.com/x/space/wbi/arc/search?mid=3706962053172003",
            "https://rss.injahow.cn/bilibili/user/dynamic/3706962053172003",
            "https://rsshub.app/bilibili/user/dynamic/3706962053172003",
          ]
          for u in urls:
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": UA, "Accept": "*/*"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read(200)
                      print("PROBE OK  %s %s | %r" % (r.status, u[:75], body[:100]))
              except urllib.error.HTTPError as e:
                  print("PROBE HTTP%s %s" % (e.code, u[:90]))
              except Exception as e:
                  print("PROBE ERR  %s | %s" % (u[:75], repr(e)[:70]))
          EOF
