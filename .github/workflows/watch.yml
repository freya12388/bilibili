name: bili-dynamic-watch

on:
  schedule:
    - cron: "* * * * *"        # 每分钟（GitHub 高峰期可能延迟或偶发跳过）
  workflow_dispatch:            # 支持手动触发测试

permissions:
  contents: write

concurrency:
  group: bili-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run watcher
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          UP_MID: "3706962053172003"
        run: python main.py

      - name: Commit state
        run: |
          git config user.name  "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git push)
