name: keepalive
on:
  schedule:
    - cron: "23 3 1 * *"        # 每月1日空提交一次，防止60天无动态导致仓库被判不活跃、调度被停
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive [skip ci]" || true
          git push
